[project]
authors = [{name = "Hugo Merzisen", email = "hugo.merzisen@meteo.fr"}]
dependencies = []
name = "fast-shadow"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
fast_shadow = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
xarray = ">=2026.7.0,<2027"
rioxarray = ">=0.22.0,<0.23"
matplotlib = ">=3.11.1,<4"
marimo = ">=0.23.15,<0.24"
